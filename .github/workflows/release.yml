name: 自动发布

on:
  push:
    tags: ['v*']        # 推送 v 开头的 tag 时自动打包并发布 Release
  workflow_dispatch:    # 手动触发：仅打包验证，不发布

permissions:
  contents: write       # 允许创建 Release 并上传附件

jobs:
  build:
    name: 打包并发布
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 打包 exe
        run: pyinstaller --onefile --windowed --noconfirm --name 校园网登录器 --add-data "赞赏码.jpg;." main.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 校园网登录器-exe
          path: dist/校园网登录器.exe

      - name: 重命名发布附件
        # GitHub Release 附件不支持中文文件名（无论网页还是 API 上传都会被存成 default.exe），改用英文名
        if: startsWith(github.ref, 'refs/tags/')
        run: Rename-Item "dist/校园网登录器.exe" "HSTC-CampusLogin.exe"

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HSTC-CampusLogin.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
